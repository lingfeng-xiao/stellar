# 文件名：.github/workflows/deploy.yml
# 官方文档：Workflow 语法
# https://docs.github.com/actions/writing-workflows/workflow-syntax-for-github-actions

name: Deploy to My Server

# 官方文档：触发事件
# https://docs.github.com/actions/writing-workflows/events-that-trigger-workflows
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy on Self-Hosted Runner

    # 官方文档：自托管 Runner
    # https://docs.github.com/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners
    runs-on: self-hosted

    steps:
      # 官方文档：checkout action
      # https://github.com/actions/checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 官方文档：setup-java
      # https://github.com/actions/setup-java
      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 你的项目构建方式
      - name: Build Project
        run: mvn clean package -DskipTests

      # 部署（完全在你的服务器执行，不需要 SSH）
      # 这里你可以根据实际情况修改路径
      - name: Restart App
        run: |
          # 查找 stellar-facade 模块下最新的 JAR
          JAR=$(ls -t stellar-facade/target/*.jar | grep -v original | head -n 1)

          if [ -z "$JAR" ]; then
            echo "❌ No JAR found in stellar-facade/target"
            exit 1
          fi

          echo "Using JAR: $JAR"

          # 停掉旧进程（只杀与 stellar-facade 相关的）
          pkill -f "stellar-facade" || true

          # 启动新版本
          nohup java -jar "$JAR" --spring.profiles.active=prod >/home/lingfeng/app.log 2>&1 &

          echo "🚀 Application restarted!"
      
